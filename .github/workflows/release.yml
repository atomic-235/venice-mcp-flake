name: Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: atomic-235
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve latest npm version
        id: latest
        run: |
          version="$(curl -fsSL https://registry.npmjs.org/@veniceai/mcp-server/latest | jq -r .version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compare with pinned version
        id: check
        run: |
          current="$(jq -r .version version.json)"
          echo "pinned=${current}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${{ steps.latest.outputs.version }}" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version, lock and hash
        id: hashes
        if: steps.check.outputs.new == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          meta="$(curl -fsSL "https://registry.npmjs.org/@veniceai/mcp-server/${VERSION}")"
          integrity="$(printf '%s' "$meta" | jq -r .dist.integrity)"
          tarball="$(printf '%s' "$meta" | jq -r .dist.tarball)"

          tmp="$(mktemp -d)"
          curl -fsSL "$tarball" | tar xz -C "$tmp"
          ( cd "$tmp/package" && npm install --package-lock-only --ignore-scripts --legacy-peer-deps >/dev/null )
          cp "$tmp/package/package-lock.json" package-lock.json

          npm_deps_hash="$(nix run nixpkgs#prefetch-npm-deps -- package-lock.json | tail -1)"

          jq -n --arg v "$VERSION" --arg i "$integrity" --arg h "$npm_deps_hash" \
            '{version: $v, integrity: $i, npmDepsHash: $h}' > version.json

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.hashes.outputs.publish == 'true'
        run: nix build --no-link .#default

      # Publish the store path before moving any ref, so the tagged commit is
      # always substitutable.
      - name: Push to cache
        if: steps.hashes.outputs.publish == 'true'
        run: cachix push atomic-235 "$(nix build --no-link --print-out-paths .#default)"

      - name: Commit and tag
        if: steps.hashes.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json package-lock.json flake.lock
          git commit -m "release: venice-mcp-server ${VERSION}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git tag -f "v${VERSION}"
          git tag -f latest
          git push --force origin "v${VERSION}" latest
